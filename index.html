<!doctype html>
<html lang="he" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><meta name="description" content="רועי שיווק — מוצרי אריזה, כלים חד פעמיים וחומרי ניקוי"><title>רועי שיווק | אריזה. אירוח. עסק.</title><style>
:root{--ink:#173e36;--paper:#f7f6f0;--accent:#dded9d;--line:#dce0d6}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font-family:Arial,sans-serif;line-height:1.6}a{color:inherit;text-decoration:none}button,input,select{font:inherit}button,.button{cursor:pointer;border:0;border-radius:8px;background:var(--ink);color:white;padding:13px 22px;display:inline-block}a:focus-visible,button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid #9a611c;outline-offset:4px}.skip{position:absolute;top:-80px}.skip:focus{top:0;background:white;padding:12px;z-index:10}.notice{text-align:center;background:var(--ink);color:white;font-size:12px;padding:7px}header{padding:22px 5%;display:flex;align-items:center;gap:32px;border-bottom:1px solid var(--line);background:var(--paper)}.brand{font-size:29px;font-weight:900;letter-spacing:-1px}.brand small{display:block;font-size:10px;letter-spacing:3px}nav{display:flex;gap:24px;flex:1}main{min-height:65vh;max-width:1440px;margin:auto;padding:40px 5%}.hero{display:grid;grid-template-columns:1.2fr 1fr;gap:50px;align-items:center;padding:50px 0 80px}.eyebrow{font-size:13px;letter-spacing:2px}h1{font-size:clamp(38px,6vw,82px);line-height:1.08;letter-spacing:-3px;margin:20px 0}h2{font-size:30px}p{max-width:660px}.hero p{font-size:19px;color:#52675e}.art{background:var(--accent);border-radius:100px 12px 12px 12px;min-height:350px;display:grid;place-content:center;text-align:center;font-size:45px;line-height:1.5}.art small{font-size:15px}.sectionhead{display:flex;justify-content:space-between;align-items:center}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:16px}.card{background:white;border:1px solid var(--line);padding:24px;border-radius:12px;display:flex;flex-direction:column;gap:12px}.card h3{font-size:18px;margin:0}.card:hover{border-color:var(--ink)}.card small{color:#69786f}.category{min-height:130px;justify-content:space-between}.category span{font-size:13px;color:#758379}.toolbar{display:flex;gap:12px;margin:24px 0;flex-wrap:wrap}input,select{padding:13px;border:1px solid #aab7ac;border-radius:8px;background:white;max-width:100%}input{flex:1;min-width:180px}.muted{color:#66756b}.empty{padding:50px;border:1px dashed #acb8ac;border-radius:12px}footer{padding:40px 5%;background:var(--ink);color:white;display:flex;justify-content:space-between;gap:25px;flex-wrap:wrap}footer a{display:block}.about{margin:70px 0;padding:40px;background:#e9ece1;border-radius:12px}.row{display:flex;align-items:center;gap:16px;padding:20px 0;border-bottom:1px solid var(--line);flex-wrap:wrap}.row h3{flex:1}.row input{flex:0;width:85px;min-width:0}.secondary{background:#e6eadf;color:var(--ink)}@media(max-width:800px){header{gap:16px;flex-wrap:wrap}nav{order:3;width:100%;flex-basis:100%;justify-content:space-between;font-size:14px}.brand{flex:1}.hero{grid-template-columns:1fr;gap:25px;padding-top:15px}.art{min-height:210px;font-size:32px}.grid{grid-template-columns:repeat(2,1fr)}main{padding:25px 5%}h1{letter-spacing:-1px}.card{padding:17px}.sectionhead h2{font-size:25px}}@media(prefers-reduced-motion:no-preference){.card{transition:border-color .2s}}
</style></head><body><a class="skip" href="#main">דילוג לתוכן</a><div class="notice">תצוגת פיתוח • הקטלוג בהעברה • אין אפשרות לבצע הזמנה באתר זה</div><header><a class="brand" href="#/">רועי שיווק<small>אריזה · אירוח · עסק</small></a><nav aria-label="ניווט ראשי"><a href="#/catalog">קטלוג מוצרים</a><a href="#/about">על העסק</a><a href="#/contact">יצירת קשר</a></nav><a class="button" href="#/cart">הסל שלי <span id="count">0</span></a></header><main id="main" tabindex="-1"></main><footer><div class="brand">רועי שיווק</div><div>החרושת 3, נשר<a href="tel:046971611">04-6971611</a><a href="mailto:royarizot@gmail.com">royarizot@gmail.com</a></div><div>פרויקט חדש ונפרד<br>גרסת פיתוח מקומית בלבד</div></footer><script>
const categories=['כלים חד פעמיים','צלחות וכלים לאירוח ולחג','כלים מתכלים','כלים מקלקר','כוסות, מכסים, וקשים','קינוחים','סכו"ם','קערות ומגשים','גביעים ומיכלים פלסטיק+קרטון','תבניות','רדידים ונצמדים','מוצרי קרטון','שקיות ומוצרי נייר','ניירות ניגוב','מתקנים','מפות, מפיות, וסדינים','ניירות לקופה,טונרים, מקודדים, מדבקות','שקיות ומוצרי ניילון','שקיות אשפה','חומרי ניקוי','מגבונים','אביזרי ניקוי','כפפות','מבשמי אוויר','אריזות מתנה','ציוד למשרד ולבית','שתייה ומזון','שונות'];
const names=['לפתניה לבן 20 יח- 50 בקרטון','לפתניה קרם 20 יח- 50 בקרטון','לפתניה שקוף 25 יח פאלאס- 40 בקרטון','מרקיה זהב 20 יח- 40 בקרטון- אין במלאי ניתן להזמין','מרקיה כסף 20 יח- 40 בקרטון- אין במלאי ניתן להזמין','מרקיה לבן 20 יח- 24 בקרטון','מרקיה קרם 20 יח- 24 בקרטון','מרקיה שחור 20 יח- 24 בקרטון','צלחת 1 ק"ג גדולה קשיחה- 12 בקרטון','צלחת 1 ק"ג גדולה קשיחה- בודד!!','צלחת 10 זהב 20 יח- 26 בקרטון','צלחת 10 כסף 20 יח- 26 בקרטון','צלחת 10 לבן 20 יח פלאלס- 26 בקרטון','צלחת 10 קרם 20 יח- 26 בקרטון','צלחת 10 שחור 20 יח- 26 בקרטון','צלחת 10 שקוף 25 יח- 20 בקרטון','צלחת 7 לבן 20 יח פאלאס- 26 בקרטון','צלחת 7 קרם 20 יח פאלאס- 26 בקרטון','צלחת 7 שחור 20 יח- 26 בקרטון','צלחת 9 ארוז 100 יח- 10 בקרטון','צלחת 9 זהב 20 יח- 26 בקרטון','צלחת 9 כסף 20 יח- 40 בקרטון','צלחת 9 לבן 20 יח פאלאס- 26 בקרטון','צלחת 9 קרם 20 יח פאלאס- 26 בקרטון','צלחת 9 שחור 20 יח- 26 בקרטון'];
const products=names.map((name,id)=>({id,name,category:0}));let cart={};try{const stored=JSON.parse(localStorage.getItem('roy-cart')||'{}');for(const [id,qty] of Object.entries(stored))if(products[Number(id)]&&Number.isInteger(qty)&&qty>0&&qty<=99)cart[id]=qty}catch{}
const main=document.querySelector('main');const escapeHtml=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const about='חברת רועי שיווק הינה בעלת מוניטין של עשרות שנים (דור שני) בתחום שיווק ומכירת מוצרי אריזה, שקיות ניילון, כלים חד פעמיים, חומרי ניקיון, כלי בית ותבניות אלומיניום. החברה מציעה פתרונות אריזה, לרבות מוצרי אריזה בהתאמה אישית לפי צרכי הלקוח. קהל הלקוחות כולל רשתות, מוסדות, עסקים קטנים וגדולים וחנויות.';
function save(){try{localStorage.setItem('roy-cart',JSON.stringify(cart))}catch{}document.querySelector('#count').textContent=Object.values(cart).reduce((a,b)=>a+b,0)}
function categoryCards(){return categories.map((name,i)=>'<a class="card category" href="#/catalog/'+i+'"><span>'+String(i+1).padStart(2,'0')+' /</span><h3>'+escapeHtml(name)+'</h3><span>לצפייה בקטגוריה ←</span></a>').join('')}
function cards(items){return items.map(p=>'<article class="card"><small>כלים חד פעמיים</small><h3><a href="#/product/'+p.id+'">'+escapeHtml(p.name)+'</a></h3><p class="muted">מחיר לא הוצג במקור שנבדק</p><a href="#/product/'+p.id+'">פרטי המוצר ←</a></article>').join('')}
function render(){const parts=(location.hash||'#/').slice(2).split('/');const page=parts[0];save();if(!page){main.innerHTML='<section class="hero"><div><span class="eyebrow">רועי שיווק / לבית ולעסק</span><h1>כל מה שצריך.<br>לארוז. לארח.<br>לעבוד.</h1><p>מוצרי אריזה, כלים חד פעמיים וחומרי ניקוי — בקטלוג אחד, מסודר ונגיש.</p><a class="button" href="#/catalog">לגלות את הקטלוג ←</a></div><div class="art" aria-hidden="true">אריזה.<br>אירוח. עסק.<small>ROY SHIVOK</small></div></section><div class="sectionhead"><h2>מה מחפשים היום?</h2><span>28 קטגוריות</span></div><div class="grid">'+categoryCards()+'</div><section class="about"><h2>עסק משפחתי. ניסיון של דורות.</h2><p>'+about+'</p><a href="#/about">להכיר אותנו ←</a></section>'}
else if(page==='catalog'){const selected=parts[1]??'';main.innerHTML='<h1>הקטלוג שלנו</h1><p class="muted">העברת התוכן בתהליך. כרגע זמינים 25 מוצרים מקטגוריית כלים חד פעמיים.</p><div class="toolbar"><input id="search" aria-label="חיפוש מוצרים" placeholder="איזה מוצר מחפשים?"><select id="category" aria-label="קטגוריה"><option value="">כל הקטגוריות</option>'+categories.map((n,i)=>'<option value="'+i+'" '+(String(i)===selected?'selected':'')+'>'+escapeHtml(n)+'</option>').join('')+'</select></div><p id="results" role="status"></p><div id="products" class="grid"></div>';const filter=()=>{const q=document.querySelector('#search').value.trim();const c=document.querySelector('#category').value;const found=products.filter(p=>p.name.includes(q)&&(c===''||String(p.category)===c));document.querySelector('#results').textContent=found.length+' מוצרים';document.querySelector('#products').innerHTML=found.length?cards(found):'<p class="empty">לא נמצאו מוצרים בתוכן שהועבר עד כה. אפשר לנסות חיפוש אחר.</p>'};document.querySelector('#search').oninput=filter;document.querySelector('#category').onchange=filter;filter()}
else if(page==='product'){const p=products.find(p=>String(p.id)===parts[1]);main.innerHTML=p?'<a href="#/catalog">קטלוג / כלים חד פעמיים</a><h1 style="font-size:44px">'+escapeHtml(p.name)+'</h1><p>שם המוצר ופרטי האריזה הועברו מהקטלוג המקורי.</p><p class="muted">תמונה, מחיר וזמינות עדכנית טרם אומתו. הסל בגרסה זו נשמר במכשיר בלבד.</p><button id="add">הוספה לסל המקומי</button><p id="added" role="status"></p>':'<h1>המוצר לא נמצא</h1><a href="#/catalog">חזרה לקטלוג</a>';if(p)document.querySelector('#add').onclick=()=>{cart={...cart,[p.id]:Math.min(99,(cart[p.id]||0)+1)};save();document.querySelector('#added').textContent='המוצר נוסף לסל המקומי'}}
else if(page==='cart'){main.innerHTML='<h1>הסל שלי</h1><p>רשימת מוצרים מקומית בלבד. אין חיוב ואין שליחת הזמנה.</p>'+Object.entries(cart).map(([id,qty])=>'<div class="row"><h3>'+escapeHtml(products[id].name)+'</h3><input type="number" min="1" max="99" value="'+qty+'" data-qty="'+id+'" aria-label="כמות '+escapeHtml(products[id].name)+'"><button class="secondary" data-remove="'+id+'">הסרה</button></div>').join('')+(Object.keys(cart).length?'<p class="muted">לא ניתן לחשב סכום ללא מחירים מאומתים.</p><a class="button" href="#/contact">לפרטי יצירת קשר</a>':'<p class="empty">הסל עדיין ריק.</p><a class="button" href="#/catalog">לגלות מוצרים</a>');main.querySelectorAll('[data-remove]').forEach(b=>b.onclick=()=>{delete cart[b.dataset.remove];save();render()});main.querySelectorAll('[data-qty]').forEach(i=>i.onchange=()=>{cart[i.dataset.qty]=Math.max(1,Math.min(99,Math.floor(Number(i.value)||1)));save();render()})}
else if(page==='about')main.innerHTML='<h1>נעים להכיר,<br>רועי שיווק.</h1><p>'+about+'</p><p>לפי האתר המקורי, החברה משווקת את מוצריה עד לבית הלקוח. עלויות משלוח, אזורי חלוקה וזמני אספקה טרם אומתו.</p>';
else if(page==='contact')main.innerHTML='<h1>בואו נדבר.</h1><p>לשאלות על מוצרים, אריזות ופתרונות לעסק.</p><div class="grid"><a class="card" href="tel:046971611"><small>טלפון</small><h2 dir="ltr">04-6971611</h2></a><a class="card" href="mailto:royarizot@gmail.com"><small>דוא״ל</small><span>royarizot@gmail.com</span></a><div class="card"><small>כתובת</small><h2>החרושת 3, נשר</h2></div></div><p class="muted">שעות פעילות טרם אומתו.</p>';
else main.innerHTML='<h1>העמוד לא נמצא</h1><a href="#/">חזרה לבית</a>';document.title=(page==='catalog'?'קטלוג מוצרים':page==='cart'?'הסל שלי':'אריזה. אירוח. עסק.')+' | רועי שיווק'}
addEventListener('hashchange',()=>{render();main.focus();scrollTo(0,0)});render();
</script></body></html>
